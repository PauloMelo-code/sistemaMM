# CI — Sistema MM Solucoes
#
# ESTE ARQUIVO NAO FAZ DEPLOY. Quem publica e o EasyPanel, que puxa do
# repositorio e constroi a imagem pelo `Dockerfile` da raiz.
#
# Ate 2026-08-11 havia aqui dois jobs de deploy por SSH (`git reset --hard` +
# `npm ci` + `npm run build` + pm2) que **nunca chegaram a rodar** — o job `ci`
# falhava sempre no passo Build por falta de DATABASE_URL, e como os dois tinham
# `needs: ci`, nada abaixo executava. Foram removidos junto com o
# `ecosystem.config.js` quando o modelo de deploy virou EasyPanel: manter no
# repositorio um caminho de deploy comprovadamente morto e como manter uma
# tomada sem fio na parede.
#
# O QUE ESTE JOB FAZ: impedir que codigo quebrado chegue na branch que o
# EasyPanel publica. E o unico portao automatico que existe hoje.
#
# ⚠️ O QUE ELE **NAO** COBRE, e vale saber antes de confiar: nao roda
# `check-compliance.mjs`, nao aplica as migracoes contra um banco descartavel e
# nao executa as provas de `scripts/db/*.sql`. Os 143 testes sao todos de modulo
# PURO — nenhum toca banco, HTTP ou tela. Verde aqui significa "compila e as
# funcoes puras batem", nao "funciona".

name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Type Check + Testes + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # >= 22.18: `node --test` roda .ts direto (type stripping) e aceita
          # glob. Com Node 20 o `npm test` deste projeto nem parseia os testes.
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        # `npm run typecheck` = `next typegen && tsc --noEmit`. Os tipos de rota
        # do Next 16 (LayoutProps/PageProps) sao GERADOS: no checkout limpo do
        # CI o `tsc` sozinho quebra em src/app/layout.tsx (TS2304 LayoutProps).
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Conformidade com as regras da base
        # Barra Prisma, SQLite, delete fisico, tabela sem colunas de auditoria,
        # arquivo acima de 500 linhas e segredo hardcoded. Rodava so na mao.
        run: node scripts/check-compliance.mjs

      - name: Build
        # `src/lib/db/index.ts` valida DATABASE_URL na AVALIACAO do modulo, e o
        # `next build` avalia toda rota para coletar page data — entao o build
        # quebra sem a variavel, mesmo sem nunca conectar. Valor de fachada de
        # proposito: o Pool nao abre conexao durante o build, e secret de
        # verdade aqui exporia credencial a um job que nao precisa dela.
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          # Lida em tempo de BUILD pelo next.config.ts (images.remotePatterns).
          # Ausente, a app sai recusando toda foto — aqui so precisa ser valida.
          MINIO_PUBLIC_URL: http://minio.invalid:9000
        run: npm run build

      - name: Imagem de producao constroi
        # O que o EasyPanel vai fazer. Sem este passo, um Dockerfile quebrado so
        # aparece no deploy — e o build da imagem e justamente onde moram as
        # armadilhas (MINIO_PUBLIC_URL como build arg, copia de .next/static).
        run: docker build --build-arg MINIO_PUBLIC_URL=http://minio.invalid:9000 -t mm-solucoes:ci .
