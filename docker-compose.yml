services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mmsolucoes_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Storage das fotos de produto. Imagem COMUNITARIA de proposito: a API S3 e a
  # mesma do AIStor (que e licenciado), e o codigo em `src/lib/storage/` fala S3
  # puro. Dev local nao precisa da versao paga para exercitar o mesmo caminho.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      # O MinIO exige 8+ caracteres e recusa subir com menos.
      MINIO_ROOT_PASSWORD: devdevdev
    ports:
      - "9000:9000" # API S3 — e a que o app usa
      - "9001:9001" # console web — http://localhost:9001
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
